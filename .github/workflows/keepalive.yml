name: Keep scheduled watcher active

on:
  schedule:
    - cron: "17 15 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Record monthly activity
        run: |
          date -u +%Y-%m-%d > last_activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_activity.txt
          git commit -m "Keep scheduled watcher active [skip ci]" || exit 0
          git push
